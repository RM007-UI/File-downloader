name: Downloader tests

on:
  push:
    paths:
      - "tools/downloader.py"
      - "tools/test_downloader.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Check Python syntax
        run: python -m py_compile tools/downloader.py
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Validate all GitHub Actions workflows
        run: $HOME/go/bin/actionlint -color
